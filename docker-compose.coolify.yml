# ROADPASS on Coolify (Docker Compose build pack).
#
# In Coolify: New resource -> Docker Compose (from a Git repository), Base
# Directory "/", Docker Compose Location "/docker-compose.coolify.yml". Give the
# `app` service its domain in the UI. Steps and secrets: deploy/coolify/README.md.
#
# ClickHouse is the shared `clickhouse` database of the Coolify project `database` (production), reached
# over the external `coolify` network (database `roadpass`, user `roadpass`). postgres/redis are named
# rp-* because Coolify's own coolify-db / coolify-redis own the `postgres` / `redis` aliases on that network.
#
# Standard Coolify conventions used here:
#  - no `ports:` and no container_name: only Coolify's proxy (Traefik) is public,
#    and it reaches `app` on its internal port 8080 via SERVICE_URL_APP_8080;
#  - passwords are generated by Coolify (SERVICE_PASSWORD_*), the rest are
#    environment variables you set in the UI (`${VAR:?}` = required);
#  - state lives in named volumes; nothing is bind-mounted from the repository.
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
    args:
      VERSION: ${SOURCE_COMMIT:-coolify}
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  networks: [default, coolify]
  volumes:
    - fabric-crypto:/fabric/crypto:ro
    - vault-token:/vault-token:ro
  environment: &app-env
    ENVIRONMENT: production
    DATABASE_URL: postgres://roadpass:${SERVICE_PASSWORD_POSTGRES}@rp-postgres:5432/roadpass?sslmode=disable
    CLICKHOUSE_URL: clickhouse://roadpass:${CLICKHOUSE_PASSWORD:?set the roadpass ClickHouse user password}@${CLICKHOUSE_HOST:-tz5bi7rqczn47cp4e0yj9cq5}:9000/roadpass
    REDIS_URL: redis://rp-redis:6379/0
    SIGNING_MASTER_KEY: "${SIGNING_MASTER_KEY:?set 32 random bytes as hex, from openssl rand -hex 32}"
    PUBLIC_URL: ${SERVICE_URL_APP}
    FABRIC_DIR: /fabric
    FABRIC_PEER: fabric:7051
    VAULT_ADDR: http://openbao:8200
    VAULT_TOKEN_FILE: /vault-token/roadpass.token
    LOG_FORMAT: json
    # Optional: system e-mail (invitations, password resets, alerts). Can also be set later in Platform -> Email delivery.
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-ROADPASS <no-reply@localhost>}
    SMTP_TLS: ${SMTP_TLS:-starttls}
    # The public demo workspace (Capital Paving): created on start, rebuilt daily at DEMO_RESET_HOUR_UTC.
    # Set DEMO_TENANT=0 to turn it off; DEMO_TENANT_PASSWORD overrides the shared password.
    DEMO_TENANT: ${DEMO_TENANT:-1}
    DEMO_TENANT_PASSWORD: ${DEMO_TENANT_PASSWORD:-roadpass-demo-2026}
    DEMO_RESET_HOUR_UTC: ${DEMO_RESET_HOUR_UTC:-3}
    # Optional: Cloudflare Turnstile on the public contact form and the sign-in form (both set = challenge on).
    TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

services:
  rp-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: roadpass
      POSTGRES_USER: roadpass
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=32MB", "-c", "max_wal_size=4GB"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadpass -d roadpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  rp-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Signing keys: OpenBao Transit; private keys never leave it. The listener is
  # internal to this stack. Its config comes from BAO_LOCAL_CONFIG, so no file is mounted.
  openbao:
    build:
      context: .
      dockerfile: deploy/openbao/Dockerfile
    restart: unless-stopped
    command: ["server"]
    environment:
      BAO_LOCAL_CONFIG: |
        {"storage":{"file":{"path":"/openbao/file"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"api_addr":"http://openbao:8200","ui":false,"disable_mlock":true}
    volumes: [openbao-data:/openbao/file]
    healthcheck:
      # 200 active, 501 not initialised, 503 sealed: the server is up either way.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/seal-status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: initialise and unseal OpenBao, enable Transit, issue the app token.
  openbao-init:
    build:
      context: .
      dockerfile: deploy/openbao/Dockerfile
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - openbao-init:/state
      - vault-token:/token
    depends_on:
      openbao: { condition: service_healthy }

  # The Hyperledger Fabric 2.5 network (orderer, two peers, the chaincode), self-contained.
  fabric:
    build:
      context: .
      dockerfile: deploy/fabric/Dockerfile
    restart: unless-stopped
    volumes:
      - fabric-data:/roadpass/fabric/data
      - fabric-run:/roadpass/fabric/.run
      - fabric-crypto:/roadpass/fabric/crypto
    stop_grace_period: 20s
    # One container runs the orderer, both peers and the chaincode: limit it as a whole.
    # GOMEMLIMIT keeps their Go runtimes under the cap, so they collect garbage instead of being OOM-killed.
    environment:
      GOMEMLIMIT: ${FABRIC_GOMEMLIMIT:-1700MiB}
    deploy:
      resources:
        limits:
          cpus: "${FABRIC_CPUS:-2}"
          memory: ${FABRIC_MEM_LIMIT:-1g}
        reservations:
          memory: ${FABRIC_MEM_RESERVATION:-768m}

  app:
    <<: *app
    command: ["serve"]
    environment:
      <<: *app-env
      # Coolify reads this: it routes your domain to the container's port 8080 and issues the certificate.
      SERVICE_URL_APP_8080: ""
    healthcheck:
      test: ["CMD", "/roadpass", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      openbao-init: { condition: service_completed_successfully }
      rp-postgres: { condition: service_healthy }
      rp-redis: { condition: service_healthy }
      fabric: { condition: service_healthy }

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      WORKER_NAME: worker-1
    healthcheck:
      test: ["CMD", "/roadpass", "health", "-worker"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      openbao-init: { condition: service_completed_successfully }
      rp-postgres: { condition: service_healthy }
      rp-redis: { condition: service_healthy }
      fabric: { condition: service_healthy }

networks:
  coolify:
    external: true

volumes:
  pg:
  redis:
  openbao-data:
  openbao-init:
  vault-token:
  fabric-data:
  fabric-run:
  fabric-crypto:
