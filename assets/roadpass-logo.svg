<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="stages" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="0.2" stop-color="#eb6834"/>
      <stop offset="0.4" stop-color="#1baf7a"/>
      <stop offset="0.6" stop-color="#eda100"/>
      <stop offset="0.8" stop-color="#e87ba4"/>
      <stop offset="1" stop-color="#008300"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#1d1d1f"/>
  <!-- road in perspective -->
  <path d="M150 330 L222 120 h68 L362 330" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
